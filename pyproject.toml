# Package configuration

# ============================================================================
# BUILD SYSTEM
# ============================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# requires = ["hatchling"]
# build-backend = "hatchling.build"


# ============================================================================
# PROJET METADATA
# ============================================================================
[project]
name = "WinCopies"
dynamic = ["version"]

description = "A rigorous, architecture-first Python framework."

readme = "README.md"

requires-python = ">=3.12"

# License (SPDX license identifier)
license = {text = "GPL-3.0"}

authors = [
    {name = "Pierre Sprimont"}
]

maintainers = [
    {name = "Pierre Sprimont"}
]

keywords = [
    "framework",
    "typing",
    "abstractions",
    "architecture",
    "dotnet-inspired",
    "enumeration",
    "collections"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# WinCopies/Serialization/JSON.py imports ijson unconditionally at module level.
dependencies = ["ijson"]

[project.urls]
Homepage = "https://wincopies.com"
# Documentation = "https://wincopies.readthedocs.io"
Repository = "https://github.com/pierresprim/WinCopies-framework-Python"
"Bug Tracker" = "https://github.com/pierresprim/WinCopies-framework-Python/issues"
Changelog = "https://github.com/pierresprim/WinCopies-framework-Python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Analysis floors, not preferences. Below these versions the checkers report diagnostics
# that are artefacts of the checker rather than facts of the code; a pass has already been
# spent opening a defect that was only ever one of those, and a later pass nearly spent a
# second re-opening it. Raise a floor only against a version known to change the behaviour
# in question: two versions on the same side of a fix are not two independent witnesses.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyright>=1.1.414",
    "mypy>=2.3.1"
]

# ============================================================================
# SETUPTOOLS CONFIGURATION
# ============================================================================
[tool.setuptools]
# Automatic package discovery
packages = ["WinCopies"]

[tool.setuptools.dynamic]
version = {attr = "WinCopies.__version__"}
[tool.setuptools.package-data]
WinCopies = ["py.typed"]


# ============================================================================
# PYRIGHT CONFIGURATION - Type checker
# ============================================================================
# Declared here rather than left to each editor. Pyright takes its settings from
# .vscode/settings.json when nothing else supplies them, and that file is ignored,
# so until now the project had no shared pyright configuration at all: two people
# checking the same tree could disagree about whether it is clean without either
# being wrong. Measured on this tree the three modes agree — basic, standard and
# strict all report nothing — so the divergence was latent, not actual; it becomes
# actual on the first diagnostic that strict reports and standard does not.
#
# pythonVersion matches [tool.mypy] below. The two checkers were aimed at two
# language versions, which costs nothing today and settles nothing either.
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["WinCopies", "Tests"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = "warning"


# ============================================================================
# MYPY CONFIGURATION - Type checker
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict = true

[[tool.mypy.overrides]]
module = "Tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "ijson.*"
ignore_missing_imports = true


# ============================================================================
# PYTEST CONFIGURATION - Tests
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=WinCopies",
    "--cov-report=term-missing",
    "--cov-report=html",
]
# The suite mirrors the WinCopies package layout: a test module is named after
# the module it covers (`Tests/Collections/Registry.py`), not prefixed. Without
# this line pytest's default `test_*.py` matches nothing here and the whole
# suite is silently collected as empty.
python_files = ["*.py"]
testpaths = ["Tests"]
pythonpath = ["."]


# ============================================================================
# COVERAGE CONFIGURATION
# ============================================================================
[tool.coverage.run]
source = ["WinCopies"]
omit = [
    "*/Tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
